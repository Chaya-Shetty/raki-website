<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Rakhi ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="page-two">


    <main class="wish-container">

        <div class="wish-card">


            <!-- =====================================
                 SMALL HEADING
            ====================================== -->

            <p class="special-text">
                ✨ A LITTLE SURPRISE FOR YOU ✨
            </p>


            <!-- =====================================
                 BROTHER NAME
            ====================================== -->

            <h1 id="brotherName">
                My Dear Brother ❤️
            </h1>


            <!-- =====================================
                 INSTRUCTION
            ====================================== -->

            <p class="touch-text" id="touchText">

                👆 Touch the Rakhi

                <br>

                <small>
                    to open your special wish
                </small>

            </p>


            <!-- =====================================
                 RAKHI
                 
                 IMPORTANT:
                 Clicking/touching the Rakhi
                 opens final.html
            ====================================== -->

            <div
                class="rakhi-wrapper"
                onclick="openWishPage()"
            >


                <!-- LEFT THREAD -->

                <div
                    class="rakhi-thread left-thread">
                </div>


                <!-- RIGHT THREAD -->

                <div
                    class="rakhi-thread right-thread">
                </div>


                <!-- RAKHI -->

                <div class="rakhi">


                    <!-- OUTER RAKHI -->

                    <div class="rakhi-outer">


                        <div
                            class="rakhi-petal petal1">
                        </div>


                        <div
                            class="rakhi-petal petal2">
                        </div>


                        <div
                            class="rakhi-petal petal3">
                        </div>


                        <div
                            class="rakhi-petal petal4">
                        </div>


                        <div
                            class="rakhi-petal petal5">
                        </div>


                        <div
                            class="rakhi-petal petal6">
                        </div>


                        <div
                            class="rakhi-petal petal7">
                        </div>


                        <div
                            class="rakhi-petal petal8">
                        </div>


                    </div>


                    <!-- MIDDLE -->

                    <div class="rakhi-middle">
                    </div>


                    <!-- CENTER -->

                    <div class="center-jewel">
                        ❤️
                    </div>


                </div>

            </div>


            <!-- =====================================
                 FOOTER
            ====================================== -->

            <p class="footer-text">

                Made with ❤️ especially for you

            </p>


        </div>

    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
