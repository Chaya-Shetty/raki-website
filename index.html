<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Rakhi Surprise ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page-one">

    <!-- Decorative flowers -->
    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌸</div>
    <div class="flower flower3">🪷</div>
    <div class="flower flower4">🌷</div>

    <main class="welcome-container">

        <div class="welcome-card">

            <div class="top-decoration">
                🪷　🎀　🪷
            </div>

            <p class="small-heading">
                A LITTLE SURPRISE FOR YOU
            </p>

            <h1>
                Happy<br>
                <span>Raksha Bandhan</span>
            </h1>

            <div class="rakhi-symbol">
                🎀
            </div>

            <p class="welcome-text">
                Someone special has a Rakhi
                waiting just for you... ❤️
            </p>

            <p class="enter-text">
                Enter your name to open your
                special wish.
            </p>


            <!-- Name -->
            <div class="input-box">

                <span>👤</span>

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
                    autocomplete="off"
                >

            </div>


            <button
                class="open-button"
                onclick="openMyRakhi()"
            >
                ✨ Open My Rakhi ✨
            </button>


            <p
                id="errorMessage"
                class="error-message"
            ></p>


            <div class="bottom-decoration">
                🌸　❤️　🌸
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
